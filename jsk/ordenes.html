<script>

async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){document.getElementById('loginMsg').textContent='Captura correo y contraseña.';return}const {error}=await db.auth.signInWithPassword({email,password});if(error){document.getElementById('loginMsg').textContent=error.message;return}const ok=await loadCurrentProfile();if(!ok){await db.auth.signOut();document.getElementById('loginMsg').textContent='Tu usuario está bloqueado o no tiene un perfil válido.';return}await boot()}

async function bootstrapAdminFromLogin(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){document.getElementById('loginMsg').textContent='Captura primero correo y contraseña.';return}const {error}=await db.auth.signInWithPassword({email,password});if(error){document.getElementById('loginMsg').textContent=error.message;return}const {data,error:re}=await db.rpc('primer_admin');if(re){await db.auth.signOut();showError(re);return}if(!data){await db.auth.signOut();document.getElementById('loginMsg').textContent='Ya existe un administrador activo.';return}await loadCurrentProfile();await boot()}
async function bootstrapAdmin(){const {data,error}=await db.rpc('primer_admin');if(error){showError(error);return}if(!data){alert('Ya existe un administrador activo.');return}await loadCurrentProfile();toast('Tu usuario ahora es Administrador');render()}
async function createUser(){if(!isAdmin())return;const name=document.getElementById('uName').value.trim(),email=document.getElementById('uEmail').value.trim(),password=document.getElementById('uPassword').value,role=document.getElementById('uRole').value;if(!name||!email||password.length<6){alert('Captura nombre, correo y una contraseña de al menos 6 caracteres.');return}try{const {data,error}=await authAdminClient.auth.signUp({email,password,options:{data:{nombre:name}}});if(error)throw error;if(!data.user)throw new Error('No fue posible crear el usuario.');await new Promise(r=>setTimeout(r,250));const {error:pe}=await db.from('perfiles_usuario').update({nombre:name,correo:email,rol:role,activo:true,updated_at:new Date().toISOString()}).eq('id',data.user.id);if(pe)throw pe;await loadUsers();toast(data.session?'Usuario creado correctamente.':'Usuario creado. Si Supabase requiere confirmación, deberá confirmar su correo.');render()}catch(e){showError(e)}}
async function updateUser(id){if(!isAdmin())return;const u=users.find(x=>x.id===id);if(!u)return;const name=document.getElementById('name_'+id)?.value.trim()||u.name,role=document.getElementById('role_'+id)?.value||u.role,active=document.getElementById('active_'+id)?.value==='true';if(!name){alert('El nombre del usuario no puede quedar vacío.');return}if(id===currentUser?.id&&!active){alert('No puedes bloquear tu propio usuario.');return}try{const {error}=await db.from('perfiles_usuario').update({nombre:name,rol:role,activo:active,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;if(id===currentUser?.id){currentProfile.nombre=name}await loadUsers();toast('Usuario actualizado');render()}catch(e){showError(e)}}
async function sendPasswordReset(email){const {error}=await db.auth.resetPasswordForEmail(email);if(error){showError(error);return}toast('Se envió el enlace de recuperación al correo.')}
async function usersView(){if(!isAdmin()){document.getElementById('app').innerHTML='<div class="card"><h2>🔒 Acceso restringido</h2><div class="muted">Solo los usuarios con rol Administrador pueden administrar usuarios.</div></div>';return}await loadUsers();const adminCount=users.filter(u=>u.role==='Administrador'&&u.active).length;document.getElementById('app').innerHTML=`<div class="card"><h2>👤 Administración de usuarios</h2><div class="muted">Crea cuentas, cambia el nombre mostrado, asigna roles y activa o bloquea usuarios de JSK Órdenes.</div></div><div class="grid"><div class="card"><h3>➕ Nuevo usuario</h3><div class="field"><label>Nombre</label><input id="uName"></div><div class="field"><label>Correo</label><input id="uEmail" type="email"></div><div class="field"><label>Contraseña inicial</label><input id="uPassword" type="password" minlength="6"><div class="muted">Mínimo 6 caracteres.</div></div><div class="field"><label>Rol</label><select id="uRole"><option>Vendedor</option><option>Diseño</option><option>Consulta</option><option>Administrador</option></select></div><button class="btn primary" onclick="createUser()">👤 Crear usuario</button></div><div class="card"><h3>ℹ️ Roles</h3><div><b>Administrador</b> — administra usuarios y configuración.</div><div style="margin-top:8px"><b>Vendedor</b> — usuario operativo.</div><div style="margin-top:8px"><b>Diseño</b> — usuario de trabajo.</div><div style="margin-top:8px"><b>Consulta</b> — usuario de consulta.</div><div class="muted" style="margin-top:14px">Administradores activos: ${adminCount}</div></div></div><div class="card"><h3>📋 Usuarios registrados</h3>${users.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+users.map(u=>`<tr><td><input id="name_${u.id}" value="${esc(u.name||'')}" style="min-width:150px"></td><td>${esc(u.email)}</td><td><select id="role_${u.id}"><option ${u.role==='Administrador'?'selected':''}>Administrador</option><option ${u.role==='Vendedor'?'selected':''}>Vendedor</option><option ${u.role==='Diseño'?'selected':''}>Diseño</option><option ${u.role==='Consulta'?'selected':''}>Consulta</option></select></td><td><select id="active_${u.id}"><option value="true" ${u.active?'selected':''}>🟢 Activo</option><option value="false" ${!u.active?'selected':''}>🔴 Bloqueado</option></select></td><td><div class="actions"><button class="btn primary" onclick="updateUser('${u.id}')">Guardar</button><button class="btn secondary" onclick="sendPasswordReset('${esc(u.email)}')">🔑 Restablecer contraseña</button></div></td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">No hay usuarios.</div>'}</div>`}
async function loadProducts(){const {data,error}=await db.from('productos').select('*').order('created_at',{ascending:false});if(error)throw error;products=(data||[]).map(p=>({id:p.id,code:p.codigo||'',name:p.nombre,category:p.categoria||'',unit:p.unidad||'Pieza',description:p.descripcion||'',price:Number(p.precio)||0,active:p.activo!==false,createdAt:p.created_at,updatedAt:p.updated_at}));}
async function loadOrderSources(){const {data,error}=await db.from('pedido_via').select('*').order('orden',{ascending:true}).order('nombre',{ascending:true});if(error)throw error;orderSources=(data||[]).map(r=>({id:r.id,name:r.nombre||'',active:r.activo!==false,order:Number(r.orden)||0,updatedAt:r.updated_at}));}

async function loadOrders(){const {data,error}=await db.from('pedidos').select('*, pedido_detalle(*)').order('created_at',{ascending:false});if(error)throw error;orders=(data||[]).map(o=>({id:o.folio,dbId:o.id,client:o.cliente,company:o.empresa||'',phone:o.whatsapp||'',email:o.correo||'',date:o.fecha,address:o.direccion||'',payment:o.forma_pago||'',paymentDetails:o.forma_pago_datos||'',delivery:o.entrega||'',localOptionId:o.entrega_local_id||'',localOptionName:o.entrega_local_nombre||'',postalCode:o.codigo_postal||'',city:o.ciudad||'',state:o.estado_entrega||'',orderSource:o.pedido_via||'',shippingCost:Number(o.costo_envio)||0,notes:o.notas||'',subtotal:Number(o.subtotal)||0,taxType:o.impuesto_tipo||'Sin Factura',taxRate:Number(o.impuesto_porcentaje)||0,taxAmount:Number(o.impuesto_importe)||0,total:Number(o.total)||0,status:o.estado||'Recibido',paymentStatus:o.estado_pago||'Pendiente de pago',paidAmount:Number(o.monto_pagado)||0,balance:Number.isFinite(Number(o.saldo_pendiente))?Number(o.saldo_pendiente):Math.max(0,(Number(o.total)||0)-(Number(o.monto_pagado)||0)),updatedAt:o.updated_at,items:(o.pedido_detalle||[]).map(d=>({id:d.id,qty:Number(d.cantidad)||0,desc:d.descripcion||'',unit:Number(d.precio_unitario)||0,amount:Number(d.importe)||0,productId:d.producto_id||'',productName:''}))}));}
async function loadShipping(){const [{data:cfg,error:ce},{data:locals,error:le},{data:ranges,error:re}]=await Promise.all([db.from('envio_config').select('*').eq('id',1).maybeSingle(),db.from('envio_local').select('*').order('opcion',{ascending:true}),db.from('envio_cp').select('*').eq('activo',true).order('cp_desde',{ascending:true})]);if(ce)throw ce;if(le)throw le;if(re)throw re;shippingConfig={localCost:Number(cfg?.costo_local)||0};localOptions=(locals||[]).map(r=>({id:r.id,option:Number(r.opcion),name:r.nombre||`Local ${r.opcion}`,cost:Number(r.costo)||0,active:r.activo!==false}));shippingRanges=(ranges||[]).map(r=>({id:r.id,from:Number(r.cp_desde),to:Number(r.cp_hasta),cost:Number(r.costo)||0,active:r.activo!==false,description:r.descripcion||''}));}

function summaryView(){
 const totalOrders=orders.length,totalSold=orders.reduce((s,o)=>s+(Number(o.total)||0),0),totalPaid=orders.reduce((s,o)=>s+(Number(o.paidAmount)||0),0),totalBalance=orders.reduce((s,o)=>s+Math.max(0,Number(o.balance)||((Number(o.total)||0)-(Number(o.paidAmount)||0))),0);
 const pendingPayments=orders.filter(o=>o.paymentStatus==='Pendiente de pago').length,partialPayments=orders.filter(o=>o.paymentStatus==='Pago parcial').length,paidOrders=orders.filter(o=>o.paymentStatus==='Pagado').length;
 const statusCounts=STATUSES.map(st=>({st,n:orders.filter(o=>o.status===st).length})).filter(x=>x.n),recent=[...orders].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,10);
 const recentRows=recent.map(o=>{const bal=Math.max(0,Number(o.balance)||((Number(o.total)||0)-(Number(o.paidAmount)||0)));return '<tr><td><b>'+esc(o.id)+'</b></td><td>'+esc(o.client)+(o.company?'<br><span class=\"muted\">'+esc(o.company)+'</span>':'')+'</td><td>'+esc(o.date||'')+'</td><td>'+money(o.total)+'</td><td>'+esc(o.status)+'</td><td>'+esc(o.paymentStatus||'Pendiente de pago')+'</td><td>'+money(bal)+'</td></tr>';}).join('');
 document.getElementById('app').innerHTML=`<div class="card"><h2>📊 Resumen</h2><div class="muted">Resumen general de las órdenes registradas.</div></div><div class="stats"><div class="stat"><b>${totalOrders}</b><span>Pedidos</span></div><div class="stat stat-sold"><b>${money(totalSold)}</b><span>Total vendido</span></div><div class="stat stat-paid"><b>${money(totalPaid)}</b><span>Total cobrado</span></div><div class="stat stat-balance"><b>${money(totalBalance)}</b><span>Saldo pendiente</span></div></div><div class="grid"><div class="card"><h3>💰 Estado de pagos</h3><div class="row3"><div class="stat"><b>${paidOrders}</b><span>Pagados</span></div><div class="stat"><b>${partialPayments}</b><span>Pago parcial</span></div><div class="stat"><b>${pendingPayments}</b><span>Pendientes</span></div></div></div><div class="card"><h3>📋 Pedidos por estado</h3>${statusCounts.length?statusCounts.map(x=>'<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>'+esc(x.st)+'</span><b>'+x.n+'</b></div>').join(''):'<div class="empty">No hay pedidos registrados.</div>'}</div></div><div class="card"><h3>🕒 Pedidos recientes</h3>${recent.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Folio</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Pago</th><th>Saldo</th></tr></thead><tbody>'+recentRows+'</tbody></table></div>':'<div class="empty">No hay pedidos registrados.</div>'}</div><div class="actions"><button class="btn primary" onclick="show('orders')">📋 Ver órdenes</button><button class="btn secondary" onclick="show('new')">＋ Nuevo pedido</button></div>`;

function drawItems(){const tb=document.getElementById('items');if(!tb)return;tb.innerHTML=window._items.map((x,i)=>`<tr><td><input type="number" min="1" step="1" value="${x.qty}" oninput="itemQty(${i},this.value)"></td><td><input value="${esc(x.desc)}" placeholder="Descripción" oninput="itemDesc(${i},this.value)">${x.productName?`<div class="muted">Producto: ${esc(x.productName)}</div>`:''}</td><td><input type="number" min="0" step="0.01" value="${x.unit}" oninput="itemUnit(${i},this.value)"></td><td><input type="number" min="0" step="0.01" value="${x.amount}" oninput="itemAmount(${i},this.value)"></td><td><button class="btn danger" onclick="removeItem(${i})">✕</button></td></tr>`).join('');calc()}

function addItem(){window._items.push({qty:1,desc:'',unit:'',amount:''});drawItems()}function removeItem(i){window._items.splice(i,1);if(!window._items.length)window._items.push({qty:1,desc:'',unit:'',amount:''});drawItems()}
function itemQty(i,v){window._items[i].qty=v;recalcFrom(i,'unit')}function itemDesc(i,v){window._items[i].desc=v}function itemUnit(i,v){window._items[i].unit=v;const q=Number(window._items[i].qty)||0;window._items[i].amount=v===''?'':(Number(v)||0)*q;updateRow(i)}function itemAmount(i,v){window._items[i].amount=v;const q=Number(window._items[i].qty)||0;window._items[i].unit=v===''?'':q?(Number(v)||0)/q:0;updateRow(i)}

function calcShipping(){const type=document.getElementById('delivery')?.value||'Local';const cp=document.getElementById('postalCode')?.value.trim()||'';let cost=0,msg='';const wrap=document.getElementById('localOptionWrap');if(wrap)wrap.style.display=type==='Local'?'block':'none';if(type==='Local'){const id=document.getElementById('localOption')?.value||'';const opt=localOptions.find(x=>x.id===id)||localOptions.find(x=>x.active);cost=Number(opt?.cost)||0;msg=opt?`Tarifa local: ${opt.name} · ${money(cost)}`:'No hay tarifas locales configuradas.';}else if(cp.length!==5){msg='Captura un Código Postal de 5 dígitos para calcular el costo foráneo.';}else{const r=findShippingCost(cp);if(r){cost=r.cost;msg=`Tarifa foránea por CP ${cp}: ${money(r.cost)}`;}else msg=`No existe una tarifa configurada para el CP ${cp}. Ve a 🚚 Envíos para agregarla.`;}const el=document.getElementById('shippingCost');if(el)el.value=cost.toFixed(2);const sm=document.getElementById('shippingSummary');if(sm)sm.textContent=money(cost);const msgEl=document.getElementById('shippingMsg');if(msgEl)msgEl.textContent=msg;calc()}
function calc(){const sub=window._items.reduce((s,x)=>s+(Number(x.amount)||0),0);const type=document.getElementById('taxType')?.value||'Sin Factura';const rate=type==='Requiero Factura'?16:0;const tax=Math.round(sub*rate)/100;const shipping=Number(document.getElementById('shippingCost')?.value)||0;const total=sub+tax+shipping;const a=document.getElementById('subtotal'),t=document.getElementById('taxAmount'),b=document.getElementById('total'),sm=document.getElementById('shippingSummary');if(a)a.textContent=money(sub);if(t)t.textContent=money(tax);if(sm)sm.textContent=money(shipping);if(b)b.textContent=money(total);const paid=Math.max(0,Number(document.getElementById('paidAmount')?.value)||0);const bp=document.getElementById('balancePreview');if(bp)bp.value=money(Math.max(0,total-paid));window._tax={type,rate,amount:tax,total,subtotal:sub,shipping};}

function renderClientPicker(q){const el=document.getElementById('clientPickerList');if(!el)return;const t=String(q||'').toLowerCase().trim(),f=clients.filter(c=>c.active!==false&&(!t||[c.name,c.company,c.phone,c.email].join(' ').toLowerCase().includes(t)));el.innerHTML=f.length?f.map(c=>`<button class="pickeritem" onclick="selectClient('${esc(c.id)}')"><span><b>${esc(c.name)}</b><small>${esc(c.company||'Sin empresa')}${c.phone?' · '+esc(c.phone):''}</small></span><strong>Seleccionar</strong></button>`).join(''):'<div class="empty">No hay clientes que coincidan.</div>'}
function closeClientPicker(){document.getElementById('clientPickerModal')?.remove()}
function selectClient(id){const c=clients.find(x=>x.id===id);if(!c)return;window._selectedClientId=c.id;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v||''};set('client',c.name);set('company',c.company);set('phone',c.phone);set('email',c.email);set('address',c.address);set('postalCode',c.postalCode);set('city',c.city);set('state',c.state);set('notes',c.notes);closeClientPicker();calcShipping();toast('Cliente seleccionado')}
function clientsView(){const q=String(window.clientQuery||'').toLowerCase().trim(),filtered=clients.filter(c=>!q||[c.name,c.company,c.phone,c.email,c.city,c.state].join(' ').toLowerCase().includes(q)),editing=editingClientId?clients.find(c=>c.id===editingClientId):null;document.getElementById('app').innerHTML=`<div class="card"><h2>👥 Clientes</h2><div class="muted">Catálogo de clientes. Los datos guardados aquí sirven para llenar rápidamente nuevos pedidos.</div></div><div class="grid"><div class="card"><h3>${editing?'Editar cliente':'Nuevo cliente'}</h3><div class="field"><label>Nombre del cliente *</label><input id="cname" value="${esc(editing?.name)}"></div><div class="field"><label>Nombre de la Empresa</label><input id="ccompany" value="${esc(editing?.company)}"></div><div class="row2"><div class="field"><label>WhatsApp</label><input id="cphone" value="${esc(editing?.phone)}"></div><div class="field"><label>Correo</label><input id="cemail" type="email" value="${esc(editing?.email)}"></div></div><div class="field"><label>Dirección</label><textarea id="caddress">${esc(editing?.address)}</textarea></div><div class="row3"><div class="field"><label>Código Postal</label><input id="cpostal" maxlength="5" value="${esc(editing?.postalCode)}"></div><div class="field"><label>Ciudad</label><input id="ccity" value="${esc(editing?.city)}"></div><div class="field"><label>Estado</label><input id="cstate" value="${esc(editing?.state)}"></div></div><div class="field"><label>Notas</label><textarea id="cnotes">${esc(editing?.notes)}</textarea></div><div class="field"><label>Estado</label><select id="cactive"><option value="true" ${editing?.active!==false?'selected':''}>Activo</option><option value="false" ${editing?.active===false?'selected':''}>Inactivo</option></select></div><div class="actions"><button class="btn primary" onclick="saveClient()">💾 ${editing?'Guardar cambios':'Guardar cliente'}</button>${editing?'<button class="btn secondary" onclick="editingClientId=null;render()">Cancelar</button>':''}</div></div><div class="card"><h3>Buscar clientes</h3><div class="toolbar"><input placeholder="Nombre, empresa, WhatsApp o correo..." value="${esc(window.clientQuery||'')}" oninput="window.clientQuery=this.value;render()"></div><div class="muted">${filtered.length} cliente(s) · ${clients.filter(c=>c.active!==false).length} activo(s)</div></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Cliente</th><th>Empresa</th><th>WhatsApp</th><th>Correo</th><th>Ciudad / Estado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${filtered.length?filtered.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.company||'—')}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.city||'—')} / ${esc(c.state||'—')}</td><td>${c.active?'🟢 Activo':'🔴 Inactivo'}</td><td><div class="actions"><button class="btn secondary" onclick="editingClientId='${esc(c.id)}';render()">Editar</button><button class="btn secondary" onclick="clientHistory('${esc(c.id)}')">📋 Historial</button><button class="btn secondary" onclick="toggleClient('${esc(c.id)}')">${c.active?'Desactivar':'Activar'}</button><button class="btn danger" onclick="deleteClient('${esc(c.id)}')">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No hay clientes capturados.</td></tr>'}</tbody></table></div></div>`}
async function saveClient(){const name=document.getElementById('cname').value.trim();if(!name){alert('Escribe el nombre del cliente.');return}const payload={nombre:name,empresa:document.getElementById('ccompany').value.trim()||null,whatsapp:document.getElementById('cphone').value.trim()||null,correo:document.getElementById('cemail').value.trim()||null,direccion:document.getElementById('caddress').value.trim()||null,codigo_postal:document.getElementById('cpostal').value.trim()||null,ciudad:document.getElementById('ccity').value.trim()||null,estado:document.getElementById('cstate').value.trim()||null,notas:document.getElementById('cnotes').value.trim()||null,activo:document.getElementById('cactive').value==='true',updated_at:new Date().toISOString()};try{const res=editingClientId?await db.from('clientes').update(payload).eq('id',editingClientId):await db.from('clientes').insert(payload);if(res.error)throw res.error;editingClientId=null;await loadClients();toast('Cliente guardado');render()}catch(e){showError(e)}}
async function toggleClient(id){const c=clients.find(x=>x.id===id);if(!c)return;try{const {error}=await db.from('clientes').update({activo:!c.active,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadClients();render()}catch(e){showError(e)}}
async function deleteClient(id){const c=clients.find(x=>x.id===id);if(!c||!confirm(`¿Eliminar el cliente "${c.name}" del catálogo? Los pedidos existentes conservarán sus datos.`))return;try{const {error}=await db.from('clientes').delete().eq('id',id);if(error)throw error;await loadClients();render()}catch(e){showError(e)}}
function paymentsView(){document.getElementById('app').innerHTML=`<div class="card"><h2>💳 Formas de Pago</h2><div class="muted">Configura las formas de pago disponibles y los datos que deseas mostrar al capturar e imprimir un pedido.</div></div><div class="grid"><div class="card"><h3>Agregar forma de pago</h3><div class="field"><label>Forma de pago *</label><input id="payName" placeholder="Ej. Transferencia bancaria"></div><div class="field"><label>Datos de la cuenta / instrucciones</label><textarea id="payDetails" placeholder="Banco, titular, cuenta, CLABE, referencia, enlace, etc."></textarea></div><div class="field"><label>Estado</label><select id="payActive"><option value="true">Activo</option><option value="false">Inactivo</option></select></div><div class="field"><label>Orden</label><input id="payOrder" type="number" min="0" step="1" value="0"></div><div class="actions"><button class="btn primary" onclick="savePaymentMethod()">💾 Guardar forma de pago</button></div></div><div class="card"><h3>Formas configuradas</h3><div class="tablewrap"><table class="table"><thead><tr><th>Forma de pago</th><th>Datos de la cuenta</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${paymentMethods.length?paymentMethods.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td><div style="white-space:pre-wrap">${esc(x.details||'—')}</div></td><td>${x.active?'🟢 Activo':'🔴 Inactivo'}</td><td><div class="actions"><button class="btn secondary" onclick="editPaymentMethod('${x.id}')">Editar</button><button class="btn danger" onclick="deletePaymentMethod('${x.id}')">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No hay formas de pago configuradas.</td></tr>'}</tbody></table></div></div></div>`}
function editPaymentMethod(id){const x=paymentMethods.find(v=>v.id===id);if(!x)return;paymentsView();document.getElementById('payName').value=x.name;document.getElementById('payDetails').value=x.details;document.getElementById('payActive').value=String(x.active);document.getElementById('payOrder').value=x.order;document.querySelector('#app .actions .btn.primary').onclick=()=>savePaymentMethod(id)}
async function savePaymentMethod(id=null){const name=document.getElementById('payName').value.trim(),details=document.getElementById('payDetails').value.trim()||null,active=document.getElementById('payActive').value==='true',order=Number(document.getElementById('payOrder').value)||0;if(!name){alert('Escribe el nombre de la forma de pago.');return}try{const payload={nombre:name,datos:details,activo:active,orden:order,updated_at:new Date().toISOString()};const res=id?await db.from('formas_pago').update(payload).eq('id',id):await db.from('formas_pago').insert(payload);if(res.error)throw res.error;await loadPaymentMethods();toast('Forma de pago guardada');render()}catch(e){showError(e)}}
async function deletePaymentMethod(id){const x=paymentMethods.find(v=>v.id===id);if(!x)return;if(!confirm(`¿Eliminar la forma de pago "${x.name}"?`))return;try{const {error}=await db.from('formas_pago').delete().eq('id',id);if(error)throw error;await loadPaymentMethods();toast('Forma de pago eliminada');render()}catch(e){showError(e)}}
function sourcesView(){if(!isAdmin()){document.getElementById('app').innerHTML='<div class="card"><h2>🔒 Acceso restringido</h2><div class="muted">Solo los usuarios con rol Administrador pueden configurar Pedido vía.</div></div>';return}const editing=editingSourceId?orderSources.find(x=>x.id===editingSourceId):null;document.getElementById('app').innerHTML=`<div class="card"><h2>📥 Pedido vía</h2><div class="muted">Aquí puedes agregar, editar, ordenar, activar o desactivar los canales por los que recibes pedidos.</div></div><div class="grid"><div class="card"><h3>${editing?'✏️ Editar canal':'➕ Agregar canal'}</h3><div class="field"><label>Nombre *</label><input id="sourceName" value="${esc(editing?.name||'')}" placeholder="Ej. Mercado Libre"></div><div class="field"><label>Estado</label><select id="sourceActive"><option value="true" ${editing?.active!==false?'selected':''}>🟢 Activo</option><option value="false" ${editing?.active===false?'selected':''}>🔴 Inactivo</option></select></div><div class="field"><label>Orden</label><input id="sourceOrder" type="number" min="0" step="1" value="${editing?editing.order:orderSources.length}"></div><div class="actions"><button class="btn primary" onclick="saveOrderSource('${editing?.id||''}')">💾 ${editing?'Guardar cambios':'Agregar canal'}</button>${editing?'<button class="btn secondary" onclick="editingSourceId=null;render()">Cancelar</button>':''}</div></div><div class="card"><h3>ℹ️ Ejemplos</h3><div class="muted">Mercado Libre, WhatsApp, Facebook, Instagram, Página web, Teléfono, Mostrador, etc.</div></div></div><div class="card"><h3>📋 Canales configurados</h3><div class="tablewrap"><table class="table"><thead><tr><th>Orden</th><th>Nombre</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${orderSources.length?orderSources.map(x=>`<tr><td>${x.order}</td><td><b>${esc(x.name)}</b></td><td>${x.active?'🟢 Activo':'🔴 Inactivo'}</td><td><div class="actions"><button class="btn secondary" onclick="editingSourceId='${x.id}';render()">Editar</button><button class="btn danger" onclick="deleteOrderSource('${x.id}')">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No hay canales configurados.</td></tr>'}</tbody></table></div></div>`}
async function saveOrderSource(id=''){const name=document.getElementById('sourceName').value.trim(),active=document.getElementById('sourceActive').value==='true',order=Number(document.getElementById('sourceOrder').value)||0;if(!name){alert('Escribe el nombre del canal.');return}try{const payload={nombre:name,activo:active,orden:order,updated_at:new Date().toISOString()};const res=id?await db.from('pedido_via').update(payload).eq('id',id):await db.from('pedido_via').insert(payload);if(res.error)throw res.error;editingSourceId=null;await loadOrderSources();toast('Canal guardado');render()}catch(e){showError(e)}}
async function deleteOrderSource(id){const x=orderSources.find(v=>v.id===id);if(!x)return;if(!confirm(`¿Eliminar el canal "${x.name}"? Los pedidos históricos conservarán su dato.`))return;try{const {error}=await db.from('pedido_via').delete().eq('id',id);if(error)throw error;await loadOrderSources();toast('Canal eliminado');render()}catch(e){showError(e)}}
function shippingView(){const editing=editingShippingId?shippingRanges.find(r=>r.id===editingShippingId):null;document.getElementById('app').innerHTML=`<div class="card"><h2>🚚 Entregas y costos de envío</h2><div class="muted">Configura hasta 5 tarifas Local y las tarifas Foráneas por rangos de Código Postal.</div></div><div class="card"><h3>🏠 Tarifas Locales</h3><div class="tablewrap"><table class="table"><thead><tr><th>Opción</th><th>Nombre</th><th>Costo</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${[1,2,3,4,5].map(n=>{const x=localOptions.find(v=>v.option===n)||{option:n,name:`Local ${n}`,cost:0,active:true};return `<tr><td><b>${n}</b></td><td><input id="localName${n}" value="${esc(x.name)}"></td><td><input id="localCost${n}" type="number" min="0" step="0.01" value="${Number(x.cost)||0}"></td><td><select id="localActive${n}"><option value="true" ${x.active!==false?'selected':''}>Activo</option><option value="false" ${x.active===false?'selected':''}>Inactivo</option></select></td><td><button class="btn primary" onclick="saveLocalOption(${n})">Guardar</button></td></tr>`}).join('')}</tbody></table></div></div><div class="grid"><div class="card"><h3>${editing?'Editar tarifa':'Nueva tarifa foránea'}</h3><div class="row2"><div class="field"><label>Código Postal desde</label><input id="cpFrom" inputmode="numeric" maxlength="5" value="${editing?editing.from:''}"></div><div class="field"><label>Código Postal hasta</label><input id="cpTo" inputmode="numeric" maxlength="5" value="${editing?editing.to:''}"></div></div><div class="field"><label>Costo</label><input id="shipPrice" type="number" min="0" step="0.01" value="${editing?editing.cost:''}"></div><div class="field"><label>Descripción</label><input id="shipDesc" value="${esc(editing?.description||'')}"></div><div class="actions"><button class="btn primary" onclick="saveShippingRange()">💾 ${editing?'Guardar cambios':'Agregar tarifa'}</button>${editing?'<button class="btn secondary" onclick="editingShippingId=null;render()">Cancelar</button>':''}</div></div><div class="card"><h3>ℹ️ Impuestos y entrega</h3><p class="muted">El costo de entrega se suma al total, pero <b>no se incluye en la base del IVA</b>.</p></div></div><div class="card"><h3>Tarifas Foráneas por Código Postal</h3><div class="tablewrap"><table class="table"><thead><tr><th>CP desde</th><th>CP hasta</th><th>Costo</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody>${shippingRanges.length?shippingRanges.map(r=>`<tr><td>${r.from}</td><td>${r.to}</td><td><b>${money(r.cost)}</b></td><td>${esc(r.description||'')}</td><td><div class="actions"><button class="btn secondary" onclick="editingShippingId='${r.id}';render()">Editar</button><button class="btn danger" onclick="deleteShippingRange('${r.id}')">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No hay tarifas configuradas.</td></tr>'}</tbody></table></div></div>`}
async function saveLocalOption(option){const name=document.getElementById(`localName${option}`).value.trim()||`Local ${option}`;const cost=Number(document.getElementById(`localCost${option}`).value)||0;const active=document.getElementById(`localActive${option}`).value==='true';try{const existing=localOptions.find(x=>x.option===option);const payload={opcion:option,nombre:name,costo:cost,activo:active,updated_at:new Date().toISOString()};const res=existing?await db.from('envio_local').update(payload).eq('id',existing.id):await db.from('envio_local').insert(payload);if(res.error)throw res.error;await loadShipping();toast(`Tarifa Local ${option} guardada`);render()}catch(e){showError(e)}}
async function saveLocalShipping(){await saveLocalOption(1)}
async function saveShippingRange(){const from=Number(document.getElementById('cpFrom').value),to=Number(document.getElementById('cpTo').value),cost=Number(document.getElementById('shipPrice').value)||0,description=document.getElementById('shipDesc').value.trim()||null;if(!/^\d{5}$/.test(String(from))||!/^\d{5}$/.test(String(to))||from>to){alert('Captura rangos de Código Postal válidos de 5 dígitos.');return}const overlap=shippingRanges.some(r=>r.id!==editingShippingId&&from<=r.to&&to>=r.from);if(overlap){alert('Ese rango de Código Postal se cruza con una tarifa existente.');return}try{const payload={cp_desde:from,cp_hasta:to,costo:cost,descripcion,activo:true,updated_at:new Date().toISOString()};let q=editingShippingId?db.from('envio_cp').update(payload).eq('id',editingShippingId):db.from('envio_cp').insert(payload);const {error}=await q;if(error)throw error;editingShippingId=null;await loadShipping();toast('Tarifa guardada');render()}catch(e){showError(e)}}
async function deleteShippingRange(id){if(!confirm('¿Eliminar esta tarifa?'))return;try{const {error}=await db.from('envio_cp').delete().eq('id',id);if(error)throw error;await loadShipping();render()}catch(e){showError(e)}}
function productsView(){const q=productQuery.toLowerCase();const filtered=products.filter(p=>!q||[p.code,p.name,p.category,p.description].join(' ').toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(filtered.length/PAGE));if(productPage>pages)productPage=pages;const slice=filtered.slice((productPage-1)*PAGE,productPage*PAGE),editing=editingProductId?products.find(p=>p.id===editingProductId):null;document.getElementById('app').innerHTML=`<div class="card"><h2>📦 Productos</h2><div class="muted">Catálogo de artículos. El precio del catálogo se conserva, pero puede modificarse en cada pedido.</div></div><div class="grid"><div class="card"><h3>${editing?'Editar producto':'Nuevo producto'}</h3><div class="row2"><div class="field"><label>Código / clave</label><input id="pcode" value="${esc(editing?.code)}"></div><div class="field"><label>Nombre *</label><input id="pname" value="${esc(editing?.name)}"></div></div><div class="row2"><div class="field"><label>Categoría</label><input id="pcat" value="${esc(editing?.category)}"></div><div class="field"><label>Unidad</label><input id="punit" value="${esc(editing?.unit||'Pieza')}"></div></div><div class="row2"><div class="field"><label>Precio unitario *</label><input id="pprice" type="number" min="0" step="0.01" value="${editing?.price??''}"></div><div class="field"><label>Estado</label><select id="pactive"><option value="true" ${editing?.active!==false?'selected':''}>Activo</option><option value="false" ${editing?.active===false?'selected':''}>Inactivo</option></select></div></div><div class="field"><label>Descripción</label><textarea id="pdesc">${esc(editing?.description)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveProduct()">💾 ${editing?'Guardar cambios':'Guardar producto'}</button>${editing?'<button class="btn secondary" onclick="cancelProductEdit()">Cancelar</button>':''}</div></div><div class="card"><h3>Buscar productos</h3><div class="toolbar"><input placeholder="Código, nombre o categoría..." value="${esc(productQuery)}" oninput="productQuery=this.value;productPage=1;render()"></div><div class="muted">${filtered.length} producto(s) · ${products.filter(p=>p.active!==false).length} activo(s)</div></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Unidad</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${slice.length?slice.map(p=>`<tr><td>${esc(p.code||'')}</td><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.description||'')}</span></td><td>${esc(p.category||'')}</td><td>${esc(p.unit||'Pieza')}</td><td><b>${money(p.price)}</b></td><td><span class="badge" style="background:${p.active!==false?'#dcfce7':'#f3f4f6'};color:${p.active!==false?'#166534':'#6b7280'}">${p.active!==false?'Activo':'Inactivo'}</span></td><td><div class="actions"><button class="btn secondary" onclick="editProduct('${esc(p.id)}')">Editar</button><button class="btn secondary" onclick="toggleProduct('${esc(p.id)}')">${p.active!==false?'Desactivar':'Activar'}</button><button class="btn danger" onclick="deleteProduct('${esc(p.id)}')">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No hay productos capturados.</td></tr>'}</tbody></table></div><div class="pager"><button class="btn secondary" onclick="changeProductPage(-1)" ${productPage<=1?'disabled':''}>◀ Anterior</button><span>Página ${productPage} de ${pages}</span><button class="btn secondary" onclick="changeProductPage(1)" ${productPage>=pages?'disabled':''}>Siguiente ▶</button></div></div>`}
async function saveProduct(){const name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('pprice').value);if(!name){alert('Escribe el nombre del producto.');return}if(!Number.isFinite(price)||price<0){alert('Escribe un precio válido.');return}const data={codigo:document.getElementById('pcode').value.trim()||null,nombre:name,categoria:document.getElementById('pcat').value.trim()||null,unidad:document.getElementById('punit').value.trim()||'Pieza',precio:price,activo:document.getElementById('pactive').value==='true',descripcion:document.getElementById('pdesc').value.trim()||null,updated_at:new Date().toISOString()};try{let res;if(editingProductId)res=await db.from('productos').update(data).eq('id',editingProductId);else res=await db.from('productos').insert(data);if(res.error)throw res.error;editingProductId=null;await loadProducts();toast('Producto guardado en Supabase');render()}catch(e){showError(e)}}
function editProduct(id){editingProductId=id;show('products')}function cancelProductEdit(){editingProductId=null;render()}async function toggleProduct(id){const p=products.find(x=>x.id===id);if(!p)return;try{const {error}=await db.from('productos').update({activo:p.active===false,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadProducts();render()}catch(e){showError(e)}}async function deleteProduct(id){if(!confirm('¿Eliminar este producto del catálogo?'))return;try{const {error}=await db.from('productos').delete().eq('id',id);if(error)throw error;await loadProducts();render()}catch(e){showError(e)}}
function changeProductPage(d){productPage+=d;render()}function changePage(d){page+=d;render()}
async function setPaymentStatus(folio,status){const o=orders.find(x=>x.id===folio);if(!o)return;try{let paid=Number(o.paidAmount)||0;if(status==='Pagado')paid=Number(o.total)||0;else if(status==='Pendiente de pago')paid=0;const balance=Math.max(0,(Number(o.total)||0)-paid);const {error}=await db.from('pedidos').update({estado_pago:status,monto_pagado:paid,saldo_pendiente:balance,updated_at:new Date().toISOString()}).eq('id',o.dbId);if(error)throw error;o.paymentStatus=status;o.paidAmount=paid;o.balance=balance;toast('Estado de pago actualizado')}catch(e){showError(e)}}async function setStatus(folio,status){const o=orders.find(x=>x.id===folio);if(!o)return;try{const {error}=await db.from('pedidos').update({estado:status,updated_at:new Date().toISOString()}).eq('id',o.dbId);if(error)throw error;o.status=status;toast('Estado actualizado')}catch(e){showError(e)}}function editOrder(id){editingId=id;show('new')}async function orderMessage(o){return `Hola ${o.client||''}, te comparto la orden de pedido ${o.id}. Total: ${money(o.total)}. Forma de pago: ${o.payment||'Pendiente'}.`}
function normalizePhone(phone){let d=String(phone||'').replace(/\D/g,'');if(d.length===10)d='52'+d;if(d.startsWith('521')&&d.length===13)d='52'+d.slice(3);return d}
function sendOrderWhatsApp(id){const o=orders.find(x=>x.id===id);if(!o)return;if(!o.phone){alert('Este pedido no tiene un número de WhatsApp capturado.');return}const phone=normalizePhone(o.phone);if(!phone){alert('El número de WhatsApp no es válido.');return}const text=encodeURIComponent(orderMessage(o)+'\n\nSe abrirá la impresión para que puedas guardar el PDF y adjuntarlo en WhatsApp.');window.open(`https://wa.me/${phone}?text=${text}`,'_blank');setTimeout(()=>printOrder(id),250);}
function sendOrderEmail(id){const o=orders.find(x=>x.id===id);if(!o)return;if(!o.email){alert('Este pedido no tiene un correo electrónico capturado.');return}const subject=encodeURIComponent(`Orden de pedido ${o.id} - JSK Diseño y Publicidad`);const body=encodeURIComponent(`Hola ${o.client||''},\n\nTe comparto la orden de pedido ${o.id}.\nTotal: ${money(o.total)}\nForma de pago: ${o.payment||'Pendiente'}\n\nSe abrirá la impresión para que puedas guardar el PDF y adjuntarlo a este correo.\n\nSaludos,\nJSK Diseño y Publicidad`);window.location.href=`mailto:${encodeURIComponent(o.email)}?subject=${subject}&body=${body}`;setTimeout(()=>printOrder(id),250);}

async function backupData(){
  const btn=document.getElementById('navBackup');
  if(btn)btn.disabled=true;
  try{
    toast('Preparando respaldo completo…');
    const tables=[
      ['productos','productos'],
      ['pedidos','pedidos'],
      ['pedido_detalle','pedido_detalle'],
      ['clientes','clientes'],
      ['formas_pago','formas_pago'],
      ['envio_config','envio_config'],
      ['envio_local','envio_local'],
      ['envio_cp','envio_cp'],
      ['pedido_folio_contador','pedido_folio_contador'],
      ['pedido_via','pedido_via']
    ];
    const result={
      app:'JSK Órdenes',
      version:'V35',
      tipo:'Respaldo completo',
      fecha_respaldo:new Date().toISOString(),
      tablas:{}
    };
    for(const [key,table] of tables){
      const {data,error}=await db.from(table).select('*');
      if(error)throw new Error(`No se pudo respaldar ${table}: ${error.message}`);
      result.tablas[key]=data||[];
    }
    result.resumen=Object.fromEntries(Object.entries(result.tablas).map(([k,v])=>[k,v.length]));
    const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.download=`JSK_Ordenes_Respaldo_Completo_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Respaldo completo descargado');
  }catch(e){
    console.error(e);
    alert(`No fue posible generar el respaldo completo.\n\n${e?.message||e}`);
  }finally{
    if(btn)btn.disabled=false;
  }
}
function openRestore(){
  let input=document.getElementById('restoreFileInput');
  if(!input){
    input=document.createElement('input');
    input.type='file'; input.id='restoreFileInput'; input.accept='.json,application/json'; input.style.display='none';
    input.onchange=()=>{const f=input.files?.[0]; if(f) restoreData(f); input.value=''};
    document.body.appendChild(input);
  }
  input.click();
}
async function restoreData(file){
  if(!file)return;
  try{
    const textData=await file.text();
    const backup=JSON.parse(textData);
    if(backup?.app!=='JSK Órdenes' || !backup?.tablas || typeof backup.tablas!=='object') throw new Error('El archivo no parece ser un respaldo válido de JSK Órdenes.');
    const allowed=['productos','clientes','formas_pago','envio_config','envio_local','envio_cp','pedidos','pedido_detalle','pedido_folio_contador','pedido_via'];
    const present=allowed.filter(k=>Array.isArray(backup.tablas[k]) && backup.tablas[k].length);
    if(!present.length) throw new Error('El respaldo no contiene registros restaurables.');
    const counts=Object.fromEntries(present.map(k=>[k,backup.tablas[k].length]));
    const msg='Se restaurarán/actualizarán los registros del respaldo. Los registros actuales que no estén en el respaldo NO se eliminarán.\n\n'+present.map(k=>`${k}: ${counts[k]}`).join('\n')+'\n\n¿Deseas continuar?';
    if(!confirm(msg))return;
    const order=['productos','clientes','formas_pago','envio_config','envio_local','envio_cp','pedidos','pedido_detalle'];
    let restored=0;
    for(const table of order){
      const rows=backup.tablas[table];
      if(!Array.isArray(rows)||!rows.length)continue;
      const {error}=await db.from(table).upsert(rows);
      if(error)throw new Error(`No se pudo restaurar ${table}: ${error.message}`);
      restored+=rows.length;
    }
    // El contador de folios nunca retrocede. Se conserva el mayor entre el contador actual y el respaldo.
    let currentCounter=0;
    const cur=await db.from('pedido_folio_contador').select('id,ultimo').eq('id',1).maybeSingle();
    if(!cur.error && cur.data) currentCounter=Number(cur.data.ultimo)||0;
    const backupCounter=Number(backup.tablas?.pedido_folio_contador?.find(x=>Number(x.id)===1)?.ultimo)||0;
    let maxFolio=Math.max(currentCounter,backupCounter);
    const {data:existingOrders}=await db.from('pedidos').select('folio');
    for(const row of (existingOrders||[])){const n=Number(String(row.folio||'').replace(/[^0-9]/g,''));if(Number.isFinite(n))maxFolio=Math.max(maxFolio,n)}
    for(const row of (backup.tablas?.pedidos||[])){const n=Number(String(row.folio||'').replace(/[^0-9]/g,''));if(Number.isFinite(n))maxFolio=Math.max(maxFolio,n)}
    const {error:counterError}=await db.from('pedido_folio_contador').upsert({id:1,ultimo:maxFolio});
    if(counterError)throw new Error(`No se pudo actualizar el contador de folios: ${counterError.message}`);
    await loadAll(); render();
    toast(`Restauración completada: ${restored} registros procesados. Los folios se conservaron sin retroceder.`);
  }catch(e){console.error(e);alert(`No fue posible restaurar el respaldo.\n\n${e?.message||e}`)}
}
function numberToWordsEs(n){n=Math.floor(Number(n)||0);if(n===0)return 'cero';const u=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciseis','diecisiete','dieciocho','diecinueve','veinte'];const tens=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];const hundreds=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];function under100(x){if(x<=20)return u[x];if(x<30)return 'veinti'+u[x-20];const t=Math.floor(x/10),r=x%10;return tens[t]+(r?' y '+u[r]:'')}function under1000(x){if(x===100)return 'cien';if(x<100)return under100(x);const h=Math.floor(x/100),r=x%100;return hundreds[h]+(r?' '+under100(r):'')}function chunk(x){return under1000(x)}let parts=[];const millions=Math.floor(n/1000000),thousands=Math.floor((n%1000000)/1000),rest=n%1000;if(millions){parts.push(millions===1?'un millón':numberToWordsEs(millions)+' millones')}if(thousands){parts.push(thousands===1?'mil':numberToWordsEs(thousands)+' mil')}if(rest)parts.push(chunk(rest));return parts.join(' ')}
function amountInWordsEs(amount){const v=Math.round((Number(amount)||0)*100)/100;const entero=Math.floor(v);const cents=Math.round((v-entero)*100);return `${numberToWordsEs(entero)} pesos ${String(cents).padStart(2,'0')}/100 M.N.`}
