<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Lealtad - La Junta Veracruz</title>
    <style>
        :root {
            --primary-color: #e17055;
            --secondary-color: #00b894;
            --dark-color: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e, #2f3640);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            /* Fondo integrado con tu imagen institucional y una capa clara translúcida para legibilidad */
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.92)), 
                        url('DR0016_11.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            border: 2px solid rgba(225, 112, 85, 0.4);
        }

        .logo-header {
            margin-bottom: 5px;
        }

        .logo-header img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 5px;
            border: 2px solid #fff;
        }

        h1 {
            margin: 0;
            color: #d63031;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        h1.admin-mode {
            cursor: pointer;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #636e72;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .client-banner {
            background-color: rgba(248, 249, 250, 0.95);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #dfe6e9;
            text-align: left;
        }

        .client-label {
            font-size: 0.7rem;
            color: #b2bec3;
            text-transform: uppercase;
            font-weight: bold;
        }

        .client-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-top: 2px;
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stamp {
            aspect-ratio: 1;
            border: 2px dashed #b2bec3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #b2bec3;
            font-size: 0.85rem;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .stamp.earned {
            background-color: #d63031;
            border: 2px solid #d63031;
            color: white;
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.4);
            transform: scale(1.05);
        }

        .counter {
            font-size: 1.05rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #2d3436;
        }

        .reward-box {
            background-color: rgba(255, 234, 234, 0.95);
            border: 1px dashed #d63031;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .reward-box span {
            font-weight: bold;
            color: #d63031;
        }

        /* Panel Admin Oculto */
        .admin-panel {
            display: none;
            border-top: 1px solid #dfe6e9;
            padding-top: 15px;
            margin-top: 15px;
            text-align: left;
            animation: fadeIn 0.3s ease;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 10px;
            padding: 12px;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-title {
            font-size: 0.8rem;
            color: #d63031;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
        }

        .form-group {
            margin-bottom: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #636e72;
            display: block;
            margin-bottom: 3px;
        }

        select, input {
            width: 100%;
            padding: 7px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        .admin-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.85rem;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-add {
            background-color: #00b894;
            color: white;
            flex: 1;
        }

        .btn-reset {
            background-color: #b2bec3;
            color: white;
            flex: 1;
        }

        .btn-new-client {
            background-color: #0984e3;
            color: white;
            width: 100%;
            margin-top: 4px;
        }

        .btn-share {
            background-color: #e17055;
            color: white;
            width: 100%;
            margin-top: 4px;
        }

        .btn-logout {
            background-color: #d63031;
            color: white;
            margin-top: 8px;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Logotipo circular superior -->
        <div class="logo-header">
            <img src="DR0016_11.png" alt="La Junta Veracruz Botanero" onerror="this.style.display='none'">
        </div>

        <h1 id="storeTitle">La Junta Veracruz</h1>
        <p class="subtitle">Tarjetón de Cliente Frecuente</p>

        <div class="client-banner">
            <div class="client-label">Titular de la Tarjeta</div>
            <div class="client-name" id="clientNameDisplay">Cargando...</div>
        </div>

        <div class="reward-box">
            Premio: <span>¡Botana o bebida especial gratis al completar 10 sellos!</span>
        </div>

        <div class="stamps-grid" id="stampsGrid"></div>

        <div class="counter" id="counterText">
            Sellos: 0 / 10
        </div>

        <!-- Panel de Administración -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-title">🔒 Panel de Administración</div>
            
            <div class="form-group">
                <label for="clientSelect">Seleccionar Cliente:</label>
                <select id="clientSelect" onChange="seleccionarClienteAdmin(this.value)">
                </select>
            </div>

            <button class="btn-new-client" onClick="registrarNuevoCliente()">+ Registrar Nuevo Cliente</button>
            <button class="btn-share" onClick="copiarLinkCliente()">🔗 Copiar Link del Cliente</button>

            <div class="admin-controls">
                <button class="btn-reset" onClick="resetCard()">Reiniciar</button>
                <button class="btn-add" onClick="addStamp()">+ Sello</button>
            </div>

            <button class="btn-logout" onClick="cerrarSesionAdmin()">Cerrar Panel</button>
        </div>
    </div>

    <script>
        const totalStamps = 10;
        const ADMIN_PIN = "1234";

        let clients = JSON.parse(localStorage.getItem('lajunta_clients')) || [
            { id: 1, name: "Cliente General", stamps: 0 }
        ];

        let currentClientId = clients[0].id;
        let esLinkCliente = false;

        const grid = document.getElementById('stampsGrid');
        const counterText = document.getElementById('counterText');
        const adminPanel = document.getElementById('adminPanel');
        const clientNameDisplay = document.getElementById('clientNameDisplay');
        const clientSelect = document.getElementById('clientSelect');
        const storeTitle = document.getElementById('storeTitle');

        function verificarURL() {
            const params = new URLSearchParams(window.location.search);
            const urlName = params.get('c');
            const urlStamps = parseInt(params.get('s'));

            if (urlName) {
                esLinkCliente = true;
                let existing = clients.find(c => c.name.toLowerCase() === urlName.toLowerCase());
                if (existing) {
                    currentClientId = existing.id;
                    if (!isNaN(urlStamps)) existing.stamps = urlStamps;
                } else {
                    const nuevoId = clients.length > 0 ? Math.max(...clients.map(c => c.id)) + 1 : 1;
                    const nuevo = { id: nuevoId, name: urlName, stamps: isNaN(urlStamps) ? 0 : urlStamps };
                    clients.push(nuevo);
                    currentClientId = nuevoId;
                }
            } else {
                storeTitle.classList.add('admin-mode');
                storeTitle.onclick = solicitarAccesoAdmin;
            }
        }

        function guardarDatos() {
            localStorage.setItem('lajunta_clients', JSON.stringify(clients));
        }

        function renderApp() {
            if (!esLinkCliente) {
                clientSelect.innerHTML = '';
                clients.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.id;
                    option.text = `${c.name} (${c.stamps} sellos)`;
                    if (c.id === currentClientId) option.selected = true;
                    clientSelect.appendChild(option);
                });
            }

            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient && clients.length > 0) {
                activeClient = clients[0];
                currentClientId = activeClient.id;
            }

            if (!activeClient) return;

            clientNameDisplay.innerText = activeClient.name;

            grid.innerHTML = '';
            for (let i = 1; i <= totalStamps; i++) {
                const stamp = document.createElement('div');
                stamp.classList.add('stamp');
                if (i <= activeClient.stamps) {
                    stamp.classList.add('earned');
                    stamp.innerHTML = '✓';
                } else {
                    stamp.innerHTML = i;
                }
                grid.appendChild(stamp);
            }

            counterText.innerText = `Sellos: ${activeClient.stamps} / ${totalStamps}`;

            if (activeClient.stamps >= totalStamps) {
                counterText.innerHTML = `🎉 ¡${activeClient.name} tiene recompensa lista!`;
            }
        }

        function seleccionarClienteAdmin(id) {
            currentClientId = parseInt(id);
            renderApp();
        }

        function registrarNuevoCliente() {
            const nombre = prompt("Ingresa el nombre del cliente:");
            if (nombre && nombre.trim() !== "") {
                const nuevoId = Math.max(...clients.map(c => c.id), 0) + 1;
                const nuevoCliente = { id: nuevoId, name: nombre.trim(), stamps: 0 };
                clients.push(nuevoCliente);
                currentClientId = nuevoId;
                guardarDatos();
                renderApp();
                alert(`¡${nombre.trim()} registrado con éxito!`);
            }
        }

        function copiarLinkCliente() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            const baseUrl = window.location.href.split('?')[0];
            const linkPersonal = `${baseUrl}?c=${encodeURIComponent(activeClient.name)}&s=${activeClient.stamps}`;

            navigator.clipboard.writeText(linkPersonal).then(() => {
                alert(`¡Link copiado para ${activeClient.name}!`);
            }).catch(err => {
                prompt("Copia este enlace:", linkPersonal);
            });
        }

        function solicitarAccesoAdmin() {
            if (adminPanel.classList.contains('active')) return;

            const pin = prompt("Ingrese el PIN de administración:");
            if (pin === ADMIN_PIN) {
                adminPanel.classList.add('active');
                renderApp();
            } else if (pin !== null) {
                alert("PIN incorrecto.");
            }
        }

        function cerrarSesionAdmin() {
            adminPanel.classList.remove('active');
        }

        function addStamp() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            if (activeClient.stamps < totalStamps) {
                activeClient.stamps++;
                guardarDatos();
                renderApp();
                
                if (activeClient.stamps === totalStamps) {
                    setTimeout(() => {
                        alert(`¡${activeClient.name} ha completado sus 10 sellos!`);
                    }, 200);
                }
            } else {
                alert("La tarjeta ya está completa.");
            }
        }

        function resetCard() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            if (confirm(`¿Reiniciar tarjeta de ${activeClient.name}?`)) {
                activeClient.stamps = 0;
                guardarDatos();
                renderApp();
            }
        }

        verificarURL();
        renderApp();
    </script>

</body>
</html>
