<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Lealtad</title>
    <style>
        :root {
            --primary-color: #e17055;
            --secondary-color: #00b894;
            --dark-color: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e, #2f3640);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            border: 2px solid rgba(225, 112, 85, 0.4);
        }

        .logo-header {
            margin-bottom: 8px;
            height: 215px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-header img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .title-banner {
            background-color: rgba(248, 249, 250, 0.95);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid #dfe6e9;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #d63031;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        h1.admin-mode {
            cursor: pointer;
        }

        .subtitle-banner {
            background-color: rgba(248, 249, 250, 0.95);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #dfe6e9;
            text-align: center;
        }

        .Estilo1 {
            font-size: 1.1rem;
            color: #2d3436;
            margin: 0;
            font-weight: 600;
        }

        .client-banner {
            background-color: rgba(248, 249, 250, 0.95);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #dfe6e9;
            text-align: left;
        }

        .client-label {
            font-size: 0.7rem;
            color: #b2bec3;
            text-transform: uppercase;
            font-weight: bold;
        }

        .client-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-top: 2px;
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stamp {
            aspect-ratio: 1;
            border: 2px dashed #b2bec3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #b2bec3;
            font-size: 0.85rem;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .stamp.earned {
            background-color: #80482F;
            border: 2px solid #80482F;
            color: white;
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.4);
            transform: scale(1.05);
        }

        .counter-banner {
            background-color: rgba(248, 249, 250, 0.95);
            border-radius: 10px;
            padding: 7px 8px;
            margin: 0 auto 15px auto;
            max-width: 40%;
            border: 1px solid #dfe6e9;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #2d3436;
        }

        .reward-box {
            background-color: rgba(255, 234, 234, 0.95);
            border: 1px dashed #d63031;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .reward-box span {
            font-weight: bold;
            color: #d63031;
        }

        .card-footer {
            text-align: center;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .admin-panel {
            display: none;
            border-top: 1px solid #dfe6e9;
            padding-top: 15px;
            margin-top: 15px;
            text-align: left;
            animation: fadeIn 0.3s ease;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 10px;
            padding: 12px;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-title {
            font-size: 0.8rem;
            color: #d63031;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
        }

        .form-group {
            margin-bottom: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #636e72;
            display: block;
            margin-bottom: 3px;
        }

        select, input {
            width: 100%;
            padding: 7px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        .admin-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.85rem;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-add {
            background-color: #00b894;
            color: white;
            flex: 1;
        }

        .btn-reset {
            background-color: #f39c12;
            color: white;
            flex: 1;
        }

        .btn-delete {
            background-color: #d63031;
            color: white;
            width: 100%;
            margin-top: 8px;
        }

        .btn-new-client {
            background-color: #0984e3;
            color: white;
            width: 100%;
            margin-top: 4px;
        }

        .btn-share {
            background-color: #e17055;
            color: white;
            width: 100%;
            margin-top: 4px;
        }

        .btn-save-reward {
            background-color: #6c5ce7;
            color: white;
            width: 100%;
            margin-top: 6px;
        }

        .btn-save-pin {
            background-color: #e67e22;
            color: white;
            width: 100%;
            margin-top: 6px;
        }

        .btn-logout {
            background-color: #2d3436;
            color: white;
            margin-top: 8px;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="logo-header">
            <img src="logo.png" alt="La Junta Veracruz Logo">
        </div>

        <div class="title-banner">
            <h1 id="storeTitle">Garrido</h1>
        </div>

        <div class="subtitle-banner">
            <p class="Estilo1">Tarjeta de Cliente Frecuente</p>
        </div>

        <div class="client-banner">
            <div class="client-label">Titular de la Tarjeta</div>
            <div class="client-name" id="clientNameDisplay">Cargando...</div>
        </div>

        <div class="reward-box">
            Premio: <span id="rewardTextDisplay">¡Botana o bebida especial gratis al completar 10 sellos!</span>
        </div>

        <div class="stamps-grid" id="stampsGrid"></div>

        <div class="counter-banner" id="counterText">
            Sellos: 0 / 10
        </div>

        <!-- Footer Muy Pequeño -->
        <div class="card-footer">
            JSK Diseño y Publicidad © 2021 - 2026 / <a href="mailto:jskpublicidadml@gmail.com">jskpublicidadml@gmail.com</a>
        </div>

        <div class="admin-panel" id="adminPanel">
            <div class="admin-title">🔒 Panel de Administración</div>
            
            <div class="form-group">
                <label for="clientSelect">Seleccionar Cliente:</label>
                <select id="clientSelect" onChange="seleccionarClienteAdmin(this.value)">
                </select>
            </div>

            <button class="btn-new-client" onClick="registrarNuevoCliente()">+ Registrar Nuevo Cliente</button>
            <button class="btn-share" onClick="copiarLinkCliente()">🔗 Copiar Link del Cliente</button>

            <div class="form-group" style="margin-top: 8px;">
                <label for="rewardInput">Editar Premio:</label>
                <input type="text" id="rewardInput" placeholder="Ej. ¡Botana gratis!">
            </div>
            <button class="btn-save-reward" onClick="actualizarPremio()">💾 Guardar Nuevo Premio</button>

            <div class="form-group" style="margin-top: 8px;">
                <label for="pinInput">Cambiar PIN de Admin:</label>
                <input type="text" id="pinInput" placeholder="Nuevo PIN">
            </div>
            <button class="btn-save-pin" onClick="actualizarPin()">🔑 Guardar Nuevo PIN</button>

            <div class="admin-controls">
                <button class="btn-reset" onClick="resetCard()">Reiniciar</button>
                <button class="btn-add" onClick="addStamp()">+ Sello</button>
            </div>

            <button class="btn-delete" onClick="eliminarCliente()">🗑️ Eliminar Cliente</button>
            <button class="btn-logout" onClick="cerrarSesionAdmin()">Cerrar Panel</button>
        </div>
    </div>

    <script>
        const totalStamps = 10;
        let adminPin = localStorage.getItem('lajunta_admin_pin_v') || "1234";

        let clients = JSON.parse(localStorage.getItem('lajunta_clients_v')) || [
            { id: 1, name: "Cliente General", stamps: 0 }
        ];

        let currentReward = localStorage.getItem('lajunta_reward_v') || "¡Botana o bebida especial gratis al completar 10 sellos!";

        let currentClientId = clients[0].id;
        let esLinkCliente = false;

        const grid = document.getElementById('stampsGrid');
        const counterText = document.getElementById('counterText');
        const adminPanel = document.getElementById('adminPanel');
        const clientNameDisplay = document.getElementById('clientNameDisplay');
        const clientSelect = document.getElementById('clientSelect');
        const storeTitle = document.getElementById('storeTitle');
        const rewardTextDisplay = document.getElementById('rewardTextDisplay');
        const rewardInput = document.getElementById('rewardInput');
        const pinInput = document.getElementById('pinInput');

        function verificarURL() {
            const params = new URLSearchParams(window.location.search);
            const urlName = params.get('c');
            const urlStamps = parseInt(params.get('s'));
            const urlReward = params.get('r');

            if (urlReward) {
                currentReward = decodeURIComponent(urlReward);
            }

            if (urlName) {
                esLinkCliente = true;
                let existing = clients.find(c => c.name.toLowerCase() === urlName.toLowerCase());
                if (existing) {
                    currentClientId = existing.id;
                    if (!isNaN(urlStamps)) existing.stamps = urlStamps;
                } else {
                    const nuevoId = clients.length > 0 ? Math.max(...clients.map(c => c.id)) + 1 : 1;
                    const nuevo = { id: nuevoId, name: urlName, stamps: isNaN(urlStamps) ? 0 : urlStamps };
                    clients.push(nuevo);
                    currentClientId = nuevoId;
                }
            } else {
                storeTitle.classList.add('admin-mode');
                storeTitle.onclick = solicitarAccesoAdmin;
            }
        }

        function guardarDatos() {
            localStorage.setItem('lajunta_clients_v', JSON.stringify(clients));
            localStorage.setItem('lajunta_reward_v', currentReward);
            localStorage.setItem('lajunta_admin_pin_v', adminPin);
        }

        function renderApp() {
            rewardTextDisplay.innerText = currentReward;
            rewardInput.value = currentReward;
            pinInput.value = adminPin;

            if (!esLinkCliente) {
                clientSelect.innerHTML = '';
                clients.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.id;
                    option.text = `${c.name} (${c.stamps} sellos)`;
                    if (c.id === currentClientId) option.selected = true;
                    clientSelect.appendChild(option);
                });
            }

            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient && clients.length > 0) {
                activeClient = clients[0];
                currentClientId = activeClient.id;
            }

            if (!activeClient) return;

            clientNameDisplay.innerText = activeClient.name;

            grid.innerHTML = '';
            for (let i = 1; i <= totalStamps; i++) {
                const stamp = document.createElement('div');
                stamp.classList.add('stamp');
                if (i <= activeClient.stamps) {
                    stamp.classList.add('earned');
                    stamp.innerHTML = '✓';
                } else {
                    stamp.innerHTML = i;
                }
                grid.appendChild(stamp);
            }

            counterText.innerText = `Sellos: ${activeClient.stamps} / ${totalStamps}`;

            if (activeClient.stamps >= totalStamps) {
                counterText.innerHTML = `🎉 ¡${activeClient.name} tiene recompensa lista!`;
            }
        }

        function seleccionarClienteAdmin(id) {
            currentClientId = parseInt(id);
            renderApp();
        }

        function registrarNuevoCliente() {
            const nombre = prompt("Ingresa el nombre del cliente:");
            if (nombre && nombre.trim() !== "") {
                const nuevoId = Math.max(...clients.map(c => c.id), 0) + 1;
                const nuevoCliente = { id: nuevoId, name: nombre.trim(), stamps: 0 };
                clients.push(nuevoCliente);
                currentClientId = nuevoId;
                guardarDatos();
                renderApp();
                alert(`¡${nombre.trim()} registrado con éxito!`);
            }
        }

        function eliminarCliente() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            if (clients.length <= 1) {
                alert("No puedes eliminar a todos los clientes. Debe quedar al menos uno.");
                return;
            }

            if (confirm(`¿Estás seguro de eliminar permanentemente a ${activeClient.name}?`)) {
                clients = clients.filter(c => c.id !== currentClientId);
                currentClientId = clients[0].id;
                guardarDatos();
                renderApp();
                alert("Cliente eliminado con éxito.");
            }
        }

        function actualizarPremio() {
            const nuevoTexto = rewardInput.value.trim();
            if (nuevoTexto !== "") {
                currentReward = nuevoTexto;
                guardarDatos();
                renderApp();
                alert("¡Premio actualizado con éxito!");
            } else {
                alert("El premio no puede estar vacío.");
            }
        }

        function actualizarPin() {
            const nuevoPin = pinInput.value.trim();
            if (nuevoPin !== "") {
                adminPin = nuevoPin;
                guardarDatos();
                alert("¡PIN de administración actualizado con éxito!");
            } else {
                alert("El PIN no puede estar vacío.");
            }
        }

        function copiarLinkCliente() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            const baseUrl = window.location.href.split('?')[0];
            const linkPersonal = `${baseUrl}?c=${encodeURIComponent(activeClient.name)}&s=${activeClient.stamps}&r=${encodeURIComponent(currentReward)}`;

            navigator.clipboard.writeText(linkPersonal).then(() => {
                alert(`¡Link copiado con el premio actualizado para ${activeClient.name}!`);
            }).catch(err => {
                prompt("Copia este enlace:", linkPersonal);
            });
        }

        function solicitarAccesoAdmin() {
            if (adminPanel.classList.contains('active')) return;

            const pin = prompt("Ingrese el PIN de administración:");
            if (pin === adminPin) {
                adminPanel.classList.add('active');
                renderApp();
            } else if (pin !== null) {
                alert("PIN incorrecto.");
            }
        }

        function cerrarSesionAdmin() {
            adminPanel.classList.remove('active');
        }

        function addStamp() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            if (activeClient.stamps < totalStamps) {
                activeClient.stamps++;
                guardarDatos();
                renderApp();
                
                if (activeClient.stamps === totalStamps) {
                    setTimeout(() => {
                        alert(`¡${activeClient.name} ha completado sus 10 sellos!`);
                    }, 200);
                }
            } else {
                alert("La tarjeta ya está completa.");
            }
        }

        function resetCard() {
            let activeClient = clients.find(c => c.id === currentClientId);
            if (!activeClient) return;

            if (confirm(`¿Reiniciar tarjeta de ${activeClient.name}?`)) {
                activeClient.stamps = 0;
                guardarDatos();
                renderApp();
            }
        }

        verificarURL();
        renderApp();
    </script>

</body>
</html>
